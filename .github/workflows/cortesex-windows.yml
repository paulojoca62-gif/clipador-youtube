# Monta o instalador do CortesEX-PRESS para Windows (pasta painel/).
#
# PyInstaller empacota o programa com o ffmpeg; o Inno Setup gera o
# instalador com o atalho na área de trabalho. O .exe fica para baixar no
# release "cortesex-latest" só quando o workflow é rodado à mão com publicar = sim;
# em todo push ele fica nos artefatos da execução.

name: CortesEX-PRESS (Windows)

on:
  push:
    branches: [main, claude/cortesex-painel]
    paths: ["painel/**", ".github/workflows/cortesex-windows.yml"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar o instalador no release cortesex-latest (público)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cortesex-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: painel
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Baixar o ffmpeg e o ffprobe
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          New-Item -ItemType Directory -Force bin | Out-Null
          foreach ($exe in "ffmpeg.exe", "ffprobe.exe") {
            Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter $exe | Select-Object -First 1).FullName "bin\$exe"
          }
          .\bin\ffmpeg.exe -hide_banner -filters | Select-String "subtitles"
          "$PWD\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Testes (inclui pipeline real com ffmpeg e o cofre DPAPI do Windows)
        run: python -m pytest -q tests

      - name: Empacotar (PyInstaller)
        run: |
          # número do build dentro do exe: o atualizador compara com o versao.json do release
          "BUILD = ${{ github.run_number }}`nCOMMIT = `"$env:GITHUB_SHA`"`n" | Out-File -Encoding utf8 cortesex\_build.py
          python -m PyInstaller run.py --noconfirm --clean --name CortesEX-PRESS --noconsole `
            --icon assets\cortesex.ico `
            --add-data "cortesex\web;web" --add-data "cortesex\fonts;fonts" `
            --add-binary "bin\ffmpeg.exe;bin" --add-binary "bin\ffprobe.exe;bin" `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime `
            --collect-all av --collect-all tokenizers `
            --collect-all streamlink --collect-all streamlink_cli `
            --collect-submodules websocket --collect-data certifi `
            --hidden-import cortesex.app --hidden-import cortesex._build

      - name: Testar o executável
        run: |
          $exe = "dist\CortesEX-PRESS\CortesEX-PRESS.exe"
          $v = & $exe --streamlink --version | Out-String
          Write-Host "streamlink dentro do exe: $v"
          if ($v -notmatch "streamlink") { throw "o modo streamlink do exe não respondeu" }
          $env:CORTESEX_DADOS = "$env:RUNNER_TEMP\cortesex-teste"
          $p = Start-Process $exe -ArgumentList "--sem-navegador" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $r = Invoke-RestMethod "http://127.0.0.1:8777/api/estado"; $ok = $r.nome -eq "CortesEX-PRESS" } catch {}
          }
          $html = (Invoke-WebRequest "http://127.0.0.1:8777/" -UseBasicParsing).Content
          Stop-Process -Id $p.Id -Force
          if (-not $ok -or $html -notmatch "CortesEX-PRESS") {
            Get-Content "$env:CORTESEX_DADOS\cortesex.log" -ErrorAction SilentlyContinue
            throw "o painel não abriu"
          }
          Write-Host "painel respondeu"

      - name: Montar o instalador (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DVersao=2.0.${{ github.run_number }} instalador.iss
          Get-ChildItem saida

      - name: Testar a atualização silenciosa (o mesmo comando que o atualizador usa)
        run: |
          $env:CORTESEX_DADOS = "$env:RUNNER_TEMP\cortesex-atualizacao"
          $inst = (Get-ChildItem saida\*.exe | Select-Object -First 1).FullName
          $exe = "$env:LOCALAPPDATA\Programs\CortesEX-PRESS\CortesEX-PRESS.exe"
          $reg = "$env:RUNNER_TEMP\ultima_instalacao.txt"
          python -c "import sys,subprocess; from pathlib import Path; from cortesex.atualizador import comando_instalacao as c; subprocess.Popen(c(Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3])), creationflags=0x08000200, close_fds=True)" $inst $exe $reg
          for ($i = 0; $i -lt 150 -and -not (Test-Path $reg); $i++) { Start-Sleep 2 }
          Write-Host "--- progresso:"; Get-Content "$env:RUNNER_TEMP\progresso_atualizacao.txt" -ErrorAction SilentlyContinue
          if (-not (Test-Path $reg)) {
            Get-Process | Where-Object { $_.ProcessName -match "CortesEX|powershell|is-|Instalador" } | Format-Table Id, ProcessName, StartTime
            Get-Content "$env:RUNNER_TEMP\ultima_instalacao.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "o instalador silencioso não terminou"
          }
          $cod = (Get-Content $reg).Trim()
          Write-Host "código do instalador: $cod"
          if ($cod -ne "0") { Get-Content "$env:RUNNER_TEMP\ultima_instalacao.log" -ErrorAction SilentlyContinue; throw "instalação falhou" }
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $ok = (Invoke-RestMethod "http://127.0.0.1:8777/api/estado").nome -eq "CortesEX-PRESS" } catch {}
          }
          Get-Process CortesEX-PRESS -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "o programa não reabriu depois da atualização" }
          Write-Host "instalou em silêncio e reabriu sozinho"

      - uses: actions/upload-artifact@v4
        with:
          name: CortesEX-PRESS-Instalador
          path: painel/saida/*.exe

      # Publicar o instalador é uma decisão do dono: só acontece rodando o workflow à mão
      # (Actions → CortesEX-PRESS (Windows) → Run workflow → publicar = sim). Push só monta e testa.
      - name: Publicar no release "cortesex-latest"
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem saida\*.exe | Select-Object -First 1).FullName
          Copy-Item $exe saida\CortesEX-PRESS-Instalador.exe
          $item = Get-Item saida\CortesEX-PRESS-Instalador.exe
          $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLower()
          # versao.json: o que o atualizador automático dos programas instalados lê
          @{ build = ${{ github.run_number }}; commit = "$env:GITHUB_SHA"; sha256 = $hash; tamanho = $item.Length } |
            ConvertTo-Json -Compress | Out-File -Encoding ascii saida\versao.json
          Get-Content saida\versao.json
          gh release delete cortesex-latest --yes --cleanup-tag 2>$null
          gh release create cortesex-latest saida\CortesEX-PRESS-Instalador.exe saida\versao.json `
            --target $env:GITHUB_SHA --prerelease `
            --title "CortesEX-PRESS para Windows (build ${{ github.run_number }})" `
            --notes "Baixe CortesEX-PRESS-Instalador.exe, rode e abra pelo atalho da área de trabalho. Commit $env:GITHUB_SHA."
